id: 03-captura
title: Ver el tráfico de un segmento
lab: ../examples/example.net.yaml
profile: mini
initial: initial
difficulty: fácil
duration: 20 min

brief: |
  En un switch normal, ponerse en modo promiscuo no basta para ver el tráfico de los demás: el
  switch solo entrega a cada puerto lo que va dirigido a él.

  Este laboratorio tiene la red externa configurada como *hub*. Compruébalo capturando el tráfico
  mientras otra máquina navega.

tasks:
  - Captura el segmento ext mientras exta pide la página de www.
  - Localiza la petición HTTP en la captura.
  - Explica por qué en un switch de verdad no la verías.

hints:
  - "Con `lab capture <topología> --net ext --seconds 20` obtienes el pcap en `capture/ext.pcap`."
  - Mientras capturas, lanza la petición desde exta con `curl http://www/`.
  - Mira el campo `mode` de la red ext en el YAML.

checks:
  - assert: http-status exta -> http://www/ is 200
    message: Primero comprueba que exta llega a www.

  - assert: capture ext, contains="GET /"
    message: >
      No aparece ninguna petición HTTP en capture/ext.pcap. Captura el segmento ext mientras se
      pide la página, y recuerda que `lab capture` termina solo cuando pasa el tiempo indicado.

answers:
  - id: modo-dmz
    kind: fact
    points: 5
    question: "¿En qué modo está configurada la red dmz?"
    message: Mira cómo declara la red el escenario y qué hace el conmutador con ella.
    hash: 00154761637ca746c354a6d9cfbf1da1a92e79afa6bb127bb8a1c434e9c73170

report:
  - "¿Por qué se ve el tráfico de otras máquinas si no es tuyo?"
  - "¿Qué diferencia hay entre un hub y un switch para observar el tráfico?"

solution: |
  La red ext está declarada con `mode: hub`, así que el bridge se configura con `learning off`:
  no aprende direcciones MAC y reenvía todas las tramas a todos los puertos.

  En un switch real, el puerto de tu máquina solo recibe:
    - lo dirigido a su MAC,
    - el broadcast y el multicast,
    - y lo que no esté aprendido todavía.

  Para ver el resto haría falta un puerto espejo, que es justo lo que usa la red dmz de este
  laboratorio (`mode: mirror`, con Open vSwitch).
