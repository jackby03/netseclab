# Catálogo de imágenes del laboratorio.
#
# `debian13`, `web`, `ids` y `attacker` las construye y cachea la caja durante
# su construcción (ver images/box/provision.sh), ya con las herramientas dentro:
# así el laboratorio funciona sin Internet.
#
# Las demás son recetas de images/recipes/ que se construyen a mano con
# `lab image build` cuando haga falta algo más pesado.
images:
  debian13: lab-node-v1
  web: lab-web-v1
  ids: lab-ids-v1
  attacker: lab-attacker-v1
  soc-lite: lab-soc-lite-v1
