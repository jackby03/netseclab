version: 1
name: soc-monitor
description: >
  Escenario de monitorización: un atacante, un cortafuegos con IDS, una víctima y un SOC que recibe
  los logs de todos. Sirve para practicar detección, correlación y respuesta sin montar una red
  grande.

networks:
  ext:
    cidr: 10.30.0.0/24
    type: nat
    mode: hub
  dmz:
    cidr: 10.30.1.0/24
    type: isolated
    mode: mirror
  mgmt:
    cidr: 10.30.9.0/24
    type: isolated
    mode: switch

nodes:
  - name: attacker
    image: debian13
    toolsets: [recon, webfuzz]
    links:
      - { net: ext, ip: 10.30.0.10 }

  - name: fw
    image: debian13
    links: [ext, dmz]
    packages: [nftables, suricata]
    sysctls:
      net.ipv4.ip_forward: 1

  - name: victim
    image: debian13
    links:
      - { net: dmz, ip: 10.30.1.10 }
    aliases: [www]
    packages: [apache2, php, libapache2-mod-php]
    startup: |
      systemctl enable --now apache2

  - name: soc
    image: debian13
    links:
      - { net: mgmt, ip: 10.30.9.20 }
    packages: [rsyslog, jq]

telemetry:
  soc: soc
  sources: [auth, syslog, suricata]
  retention: 48h

profiles:
  mini: [attacker, fw, victim, soc]
