name: ci

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: instalar
        run: pip install -e ".[dev]"

      - name: pruebas
        run: pytest -q

  cobertura:
    name: cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # El umbral mínimo está en pyproject.toml (fail_under)
      - name: pruebas con cobertura
        run: pytest --cov

  tipos:
    name: tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: mypy
        run: mypy

  contenido:
    name: contenido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: todas las topologías validan
        run: lab validate "lab/examples/*.yaml"

      - name: todos los ejercicios validan
        run: lab validate "lab/exercises/*.yaml"

      - name: cada ejemplo genera su plan
        run: |
          for f in lab/examples/*.yaml; do
            lab render "$f" --format json > /dev/null
          done

      - name: cada receta de imagen se puede planificar
        run: |
          for r in images/recipes/*.yaml; do
            lab image build "$r" --dry-run > /dev/null
          done

  estilo:
    name: estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src tests

      - name: ruff format
        run: ruff format --check src tests
